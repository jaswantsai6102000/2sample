<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Webpage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      line-height: 1.6;
      color: #333;
    }
    header {
      background: #f4f4f4;
      padding: 20px;
      border-radius: 8px;
    }
    button {
      padding: 10px 15px;
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Website</h1>
    <p>This is a sample HTML page with basic styling.</p>
  </header>

  <main>
    <h2>About This Page</h2>
    <p>HTML structures your content, while CSS makes it look good.</p>
    <ul>
      <li>Clean HTML5 structure</li>
      <li>Mobile-responsive viewport</li>
      <li>Embedded CSS styling</li>
    </ul>
    <button onclick="alert('Hello! Your button works.')">Click Me</button>
  </main>

</body>
</html>
